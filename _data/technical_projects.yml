projects:
  kv260:
    explanation:
      - title: DPUサイズとFPGAリソースの対応
        paragraphs:
          - B512からB4096までの構成は、使用するLUT、レジスタ、BRAM、DSPが異なります。サイズの選択を処理速度だけで決めず、ボードに収まる構成と合わせて検討します。
        figure: 1
      - title: 単一スレッドで生じるDPUの待ち時間
        paragraphs:
          - CPUが入力画像や次の処理を準備している間、DPUに仕事が渡らない区間があります。処理時間の短い推論器を載せるだけでは、この待ち時間はなくなりません。
        figure: 2
      - title: 複数フレームのCPU処理とDPU実行を重ねる
        paragraphs:
          - 処理スレッドが別のフレームを準備しながら、同じDPUへ顔検出と表情分類を渡します。複数のDPUを並べる構成ではなく、共有するDPUの待ち時間を減らす実装です。
        figure: 3
    title: KV260・Vitis AI・PYNQによるエッジAI実装
    href: /research/kv260/
    body: Vitis AIによるFP32モデルの8bit量子化・コンパイルから、KV260のDPU構成選定、CPU前処理との協調実行、利用率・スループット評価まで。Model ZooとPYNQの実装経験も紹介。
    category: edge-ai
    evidence_id: kv260
    venue: 高専時代の研究・学習
    overview: Kria KV260とVitis AIを使い、モデルの量子化・コンパイルだけでなく、DPUを含むハードウェア構成、CPUとDPUの処理分担、複数モデルの実行、システム全体の評価まで取り組みました。表情認識研究で実装・評価した内容を中心に、Model ZooとPYNQを使った経験も紹介します。
    tags: [KV260, Vitis AI 2.5, INT8, DPU, CPU・DPU協調, マルチスレッド, PYNQ]
    context:
      - 学習済みモデルをエッジ機器で動かす際には、モデルの形式、量子化、実行対象のDPUと入力前処理を対応付ける必要があります。
      - Model Zooの例で実行の流れを学び、顔検出と表情分類を同じDPUへ載せる研究に取り組みました。
    work:
      - Vitis AI Model Zooの車を対象としたセグメンテーションモデルをKV260で動かす学習。
      - Vitis AIを用いた量子化モデルの作成と、DPU向けモデルへのコンパイル。
      - PYNQを使ったPythonからのDPU実行と、モデルの入力・出力処理。
      - 表情認識研究で、カメラ入力、CPU前処理、DPUの顔検出・表情分類を接続。
      - AIエッジコンテストの公開資料を参照し、モデルをエッジ機器へ実装する手順を学習。
    implementation:
      - title: モデルの量子化とDPU向けコンパイル
        paragraphs:
          - 表情認識研究ではVitis AI 2.5のAI quantizerとAI compilerを使用しました。32bit浮動小数点のモデルを8bit整数へ量子化し、DPUで実行できる形式へコンパイルするまでを扱っています。
          - モデルを変換して終わりではなく、顔検出と表情分類をそれぞれDPUへ載せ、量子化後のモデルについて認識精度とレイテンシを評価しました。量子化・コンパイル・実行後の評価を一連の開発工程として経験しています。
      - title: DPUのハードウェア構成とサイズ選択
        paragraphs:
          - CANDARW 2024の実装では、Arm Cortex-A53とFPGAを持つKV260を使用し、Vivado 2021.1でDPUを含むハードウェアデザインを作成しました。CPUとDPUはAXIで接続され、共有するオフチップメモリと、FPGA上の画像・重み・中間特徴のバッファを使います。
          - DPUの演算並列度とFPGAリソースの関係も扱いました。ICIC Express Letters 2025では、Pixel Parallelism（PP）、Input Channel Parallelism（ICP）、Output Channel Parallelism（OCP）から1クロック当たりの演算数を整理しています。B512ではPP=4、ICP=8、OCP=8で、積和を2演算と数えると512演算になります。
          - 軽量な顔検出と表情分類にはB512を選択しました。CANDARW 2024ではB512からB4096までの構成と、300〜600 MHzのDPU動作周波数について、FPGAリソース、スループット、消費電力の違いを比較しました。最大のDPUを選ぶのではなく、システムの処理量に見合う構成を評価した経験です。
      - title: 前処理と2つのモデルを接続する実装
        paragraphs:
          - CANDARW 2024の構成は、カメラ入力からCPUで画像をリサイズし、DPUのDenseBoxで顔を検出した後、顔領域を切り出してグレースケール化し、CNNで表情を分類する流れです。画像の前処理はCPU、2つの推論は同じDPUへ割り当てました。
          - 顔検出と表情分類を時分割で実行するため、モデルごとに別のアクセラレータを増やさずにシステムを構成できます。モデル単体の推論だけでなく、入力画像、顔領域、分類結果をつなぐアプリケーション側の処理も扱っています。
      - title: CPU前処理とDPU実行のマルチスレッド化
        paragraphs:
          - 1つの処理スレッドでは、CPUが画像を処理している間にDPUが待機します。この待ち時間を減らすため、Pythonのthreadingを使い、異なるフレームのCPU処理とDPU実行を重ねました。
          - 論文の実装ではカメラ入力を専用の1スレッドへ分離し、2つの処理スレッドが1つのDPUを共有します。評価でいう「2スレッド」は処理スレッド数で、カメラ入力を含めると合計3スレッドです。複数のDPUで同時に推論する構成とは区別しています。
      - title: Model Zoo・PYNQを使った開発経験
        paragraphs:
          - Vitis AI Model Zooの車のセグメンテーションをKV260で動かし、PYNQからPythonでDPUを利用する流れを経験しました。公開モデルの入出力を確認する経験と、研究での量子化・モデル変換・前後処理の接続が、エッジAI実装の理解につながっています。
          - Model Zoo、Kria-PYNQ、AIエッジコンテストの資料を参考にした学習と、論文に記載した表情認識の実装・評価は区別しています。公開モデルやDPU自体を独自に開発したという実績ではありません。
    results:
      - CANDARW 2024のTable IIIでは、B512の処理スレッドを1つから2つへ増やすと、スループットは14.69 FPSから25.00 FPS、顔検出と表情分類を合計したDPU利用率は22.85%から78.44%となりました。DPU利用率は総実行時間に対するDPU実行時間の割合として評価しています。
      - モデルの推論速度だけでなく、CPU側の処理、DPUの待機、システム全体のFPS、FPGAリソース、消費電力を関連付けて評価しました。エッジ機器の構成を決める際に、モデル変換と実装・測定の両面から検討できる経験です。
      - 上記の数値はCANDARW 2024の当該条件の結果であり、今回の再測定ではありません。初期SASIMI実装と後続論文ではモデルや構成が異なります。Model Zooの車のセグメンテーションについて、新しい精度・速度やコンテスト参加実績は示していません。
    skip_result_figure: true
    related:
      - href: /research/facial-expression/
        label: KV260のDPUを用いた表情認識研究
      - href: /research/green-onion-dnn/
        label: 物体検出とインスタンスセグメンテーションの研究
    references:
      - href: https://github.com/Xilinx/Vitis-AI/tree/2.5/model_zoo
        label: Vitis AI 2.5 Model Zoo
      - href: https://github.com/Xilinx/Kria-PYNQ
        label: Kria-PYNQ（PythonからKriaの機能を利用する環境）
      - href: https://user.competition.signate.jp/ja/competition/detail/?competition=c2f142a1f5f6444884cb0918a3e4d3e6
        label: 第6回AIエッジコンテスト（実装コンテスト④・学習時の参考資料）
  network-analyzer:
    title: ネットワークアナライザの開発
    href: /research/network-analyzer/
    image: /assets/images/technical/network-preview.svg
    image_alt: パケット取得・解析・GUI表示の概念図。実通信データや実装画面ではありません
    body: 高専時代に制作したPythonのパケット解析GUI。通信の取得、プロトコル別表示、フィルタ、pcapの保存・読込み、通信量の可視化を扱う。
    category: systems-software
    evidence_id: network-analyzer
    venue: 高専時代のソフトウェア制作
    overview: ネットワーク通信を観察するため、Pythonでパケット解析用のGUIアプリケーションを制作しました。Scapyによるパケット取得・解析とPyQt5の画面をつなぎ、通信内容を一覧・詳細・統計で確認する構成です。
    tags: [Python, Scapy, PyQt5, TCP/IP, パケット解析, 可視化]
    context:
      - 通信を調べる際に、プロトコル、送信元・宛先、ポート、通信量を画面で確認できるツールを制作しました。
      - パケットを取得する処理と、表示・フィルタ・統計を扱うGUIを組み合わせ、通信の情報を見やすく整理しました。
    work:
      - Scapyによるパケットの取得と、Ethernet、IPv4・IPv6、TCP・UDP、ICMP、ARP等の識別・表示。
      - PyQt5によるパケット一覧と、選択したパケットのヘッダ情報の表示。
      - 送信元・宛先、プロトコル、ポートを指定するフィルタ画面。
      - キャプチャの開始・停止と、pcapファイルの保存・読込み。
      - プロトコル別の集計と、送信元・宛先の通信量をグラフで表示。
    results:
      - 保存コードで、パケット取得・フィルタ・pcap操作・統計表示を別の処理として構成したことを確認できます。
      - GUIと通信解析をつなぐ制作経験として紹介しています。現在の環境での動作再試験、解析精度、取得性能の評価は行っていません。
      - ソースリポジトリは非公開です。ローカル表示には当時の発表画面を添付していますが、pcapや生ログは掲載していません。通常buildでは画面画像を除外します。
    skip_result_figure: true
    explanation:
      - title: チーム制作と担当範囲
        paragraphs:
          - 高専の6名によるチーム制作で、プログラム開発班とGUI開発班に分かれて開発しました。最終発表資料では、安藤の担当はパケットフィルタリングのプログラミングです。一覧・詳細表示、統計、データベース、暗号化はチーム全体の成果として紹介しています。
          - ベース環境はUbuntu 20.04とPython 3です。パケット処理にScapy、画面にPyQt、保存データの管理にSQLite、暗号化にPycryptodomeを採用する仕様でした。以下の画面は当時のプレゼン資料に含まれるもので、今回の実行結果ではありません。
      - title: 一覧からパケットの詳細へ
        paragraphs:
          - 概要画面は番号、時刻、送信元アドレス、宛先アドレス、プロトコル名、パケット長、要約情報の7項目を一覧にします。色分けされた行から通信の種類と相手を追い、選択したパケットの内容へ進む構成です。
          - 下部にはパケットの16進数表示と、各レイヤの要約を階層で表示する領域を配置しました。通信全体の傾向を見る一覧と、個々のヘッダを調べる詳細を同じ画面で扱います。
        figure: 1
      - title: 担当したフィルタリングと入力検査
        paragraphs:
          - キャプチャ時の条件として、プロトコルの種類、ポート番号、アプリケーションプロトコル、送信元・宛先IPアドレスを設定する画面を制作しました。送信元と宛先をそれぞれ選び、調べたい通信の範囲を指定します。
          - 最終発表ではIPアドレスとポート番号の複数指定を追加機能として報告しています。ポート入力に「a」などの文字列が混ざる場合は無効として扱う入力検査も説明しました。画像は開発時の入力例で、すべての組合せの動作保証を示すものではありません。
        figure: 2
      - title: プロトコル別の統計とアドレス別の通信量
        paragraphs:
          - 個々のパケットを読む画面に加え、プロトコルの統計とトラフィックの統計を用意しました。プロトコルの内訳を集計することで、一覧だけでは把握しにくい通信の偏りを確認します。
        figure: 3
      - title: トラフィック統計の表示
        paragraphs:
          - 取得した通信をグラフとして表示する機能です。グラフは当時のデモ画面であり、取得性能や解析精度を測定したベンチマークではありません。
        figure: 4
      - title: 1秒単位で通信の変化を見る
        paragraphs:
          - 単位時間トラフィックの画面では横軸を時間、縦軸をパケット数とし、1秒ごとの取得パケット数を折れ線に渡しています。発表資料では、トラフィック量が多い上位5つのアドレスを表示する構成です。
          - この指標はパケット/秒であり、バイト/秒の帯域とは区別します。また、資料の残課題にはトラフィックグラフの動的変化の実装が挙がっており、掲載画像だけからリアルタイム更新の完成を主張しません。
        figure: 5
      - title: 保存仕様と開発で残った課題
        paragraphs:
          - 保存仕様はpcapデータと保存日付をSQLiteで管理し、パケット情報をAESで暗号化するものです。資料には保存件数30個、最大容量500MB、日付をキーとした参照を記載しています。これらは当時の仕様で、容量試験や暗号化の安全性評価の結果ではありません。
          - 日付からの読込みの説明には未完成を示す記述があり、データベースから読み出したパケットの詳細を確認できない点も課題として報告しています。pcap操作のコードが存在することと、保存から詳細表示まで一連の操作が完成していることを分けて扱います。
          - ほかに対応プロトコルの追加、モジュール粒度の見直し、GUIの改良を課題に挙げました。振り返りでは、GUIとキャプチャ処理の結合の難しさ、全体構成を考えてから実装する必要性、完成範囲と作業時間の調整を整理しています。
    limits:
      - 出典は「ネットワークアナライザ１班 最終発表」の3・5・10〜20・22〜24枚目です。画面は保存された発表画像で、現在の環境での再現試験は行っていません。
      - 通信アドレス等を含む当時の画面画像はローカル確認時だけ表示します。非公開コード、pcap、生ログは添付していません。
  ntt:
    explanation:
      - title: バタフライ演算から段間データ配置まで
        paragraphs:
          - 構成図の上段は、先頭2段を融合した1回の呼出しと、残りの段を処理する6回の呼出しを示しています。下段はそれぞれの呼出しにおける演算の流れです。単一のバタフライ演算だけでなく、段を連結するための出力配置までを実装対象にしました。
          - 部分積の剰余を求めてから再結合し、各段の結果を次段のレコードへ書き出します。ARMが担う正規化・並べ替えとDMAを含めて境界を揃えることで、演算部の速さと処理全体の速さを分けて評価しています。
      - title: 正しさとオフロード深度の読み方
        paragraphs:
          - CPU参照との係数一致は計算の正しさを確認する評価です。オフロード深度の図は、CGLAへ任せる処理を変えた場合の時間と投影エネルギーを比較します。FPGA実測時間とASIC投影の図を、同一の実測値として扱わないことが重要です。
    evidence_id: ntt
    title: ML-KEMで用いるNTT演算
    href: /research/ntt/
    body: q=3329上のNTT演算をCGLAに割り当てる。段間のデータ配置とARM・DMA境界まで含め、CPU参照との一致とFPGA実測を評価。
    tags: [NTT, 剰余演算, CGLA, 検証]
    paper: Implementation and Evaluation of NTT Arithmetic for ML-KEM on a CGLA
    venue: CANDARW 2026 原稿
    overview: ML-KEMで使われる法q=3329の演算を、既存のCGLAのデータパスへ載せる研究です。専用NTTユニットを追加する代わりに、演算の分解と段間レコードの配置をソフトウェアで構成しています。
    work:
      - 回転因子を8ビットと4ビットに分割し、部分積を剰余へ落としてから再結合するFP32によるバタフライ演算を構成。
      - 先頭2段を41-PE呼出しへ融合し、残りを47-PE呼出しで処理する7回の呼出しを連結する処理を実装。
      - 各段の出力を次段向けレコードへ直接格納し、ARM側の並べ替えと正規化、DMAを含む処理境界を評価。
      - CPU参照との係数比較、バッチ条件ごとの実測、ASIC投影を原稿に整理。
    results:
      - 原稿では4組の実験条件・105回のFPGA実行で817,152出力係数がCPU参照と一致しています。
      - バッチサイズ64で測定したFPGA上の処理全体の時間は27.5 µs/NTTです。これはASIC実測値ではありません。
    limits:
      - 評価対象は8段の基数2の巡回変換処理です。標準ML-KEMの7段の不完全な負巡回NTTとは異なります。
      - 標準ML-KEMの多項式乗算全体や鍵カプセル化の実装・検証結果ではありません。
      - ASICの時間・エネルギーは投影です。実シリコンの測定値として扱いません。
  bitnet:
    explanation:
      - title: 三値重みを既存の整数命令へ割り当てる
        paragraphs:
          - 重みは三値、入力活性はint8形式ですが、実行には符号付き4ビット整数命令を使います。モデルの重み形式とハードウェア命令の演算幅は別の概念です。構成図では、これらの値を演算ストリームへ対応付ける流れを示しています。
          - 厳密な整数部分内積の経路と、活性値を量子化する近似経路を分けました。後者の誤差評価は部分内積についての評価であり、生成文の品質やモデル全体の認識精度を直接測るものではありません。
      - title: C++実行環境へ組み込んだときの境界
        paragraphs:
          - 単体の演算を測るだけでなく、BitNet C++の選択した呼出しをオフロードし、データの準備・入力・実行・出力回収を含む経路を分析しました。ホストに残る処理があるため、カーネルの改善をそのまま全レイヤの高速化とみなさない評価です。
    evidence_id: bitnet
    title: BitNetの低ビット演算と実行環境への組込み
    href: /research/bitnet/
    body: 三値重みとint8形式の活性値を符号付き4ビット整数命令に割り当てる。BitNet C++の一部呼出しをオフロードし、ホスト・データ準備・出力回収の境界を分析。
    tags: [BitNet, 符号付きINT4, C++, 実行環境への組込み]
    paper: Implementation and Evaluation of BitNet Inference on a CGLA by Signed-Int4 Instructions
    venue: CANDARW 2026 原稿
    overview: BitNetの三値重みと整数の活性値の積を、再利用可能な符号付き4ビット整数命令OP_SMA4へ対応付ける研究です。演算の正確な再構成と、既存ランタイムへ接続した際の処理境界を扱います。
    work:
      - 三値重みを符号付き4ビット整数の演算レーンへ配置し、int8形式の活性値を2つの符号付き4ビット整数として符号化した断片へ分解。
      - シフトと加算、必要な要素への補正によって元の整数内積を再構成。
      - BitNet C++のランタイムの選択した1呼出しをCGLAへオフロード。
      - 入力データの準備、演算アレイの実行、出力データの回収を分け、厳密な計算経路と近似1ストリームの処理経路を比較。
    results:
      - 原稿では1呼出しをオフロードしたBitNet C++のデコード処理で2.52 トークン/秒を測定しています。
      - 整数部分内積の正しさと、近似処理経路での誤差を区別して評価しています。
    limits:
      - BitNetの全レイヤのオフロードではなく、選択した1呼出しを含むランタイム評価です。大部分の実行はホストに残ります。
      - レイヤの処理時間と840MHzのASIC性能は投影を含み、全モデルのASIC実測高速化を示すものではありません。
      - 部分内積誤差は生成トークンの品質やモデル精度とは別の指標です。
  ssm:
    explanation:
      - title: モデルの処理を異なる演算へ分解する
        paragraphs:
          - 射影演算、SSDのステップ1、再帰的な状態更新では、集約する長さと状態の扱いが異なります。構成図は射影演算とSSDの演算配置を示し、各処理が同じ条件で高速化するとは限らないことを評価しました。
          - 長い集約演算では演算部分の比重が大きい一方、短い処理ではDMAや呼出し境界の費用が相対的に大きくなります。CPU参照との出力差を確認しながら、カーネル単体とトークン実行の区間を区別しています。
      - title: デコード時間の内訳を次の課題へつなぐ
        paragraphs:
          - Mamba-130Mの内訳図では、実行環境へ組み込んだ後に残る射影GEMVの負担を確認しました。カーネルの動作確認と、モデル全体のボトルネックが解消されたことは別です。このページはMCSoC 2026原稿の評価範囲を示します。
    evidence_id: ssm
    title: Mamba系状態空間モデルのカーネル実装と評価
    href: /research/ssm/
    body: 全結合の射影演算、SSD、再帰状態更新をCGLAに割り当て、カーネル単体からトークン実行までの境界とボトルネックを評価。
    tags: [Mamba, SSM, カーネルの割当て, 性能分析]
    paper: Mamba-Family State-Space Model Kernels on a Programmable CGLA
    venue: MCSoC 2026 原稿
    overview: Mamba系の推論処理を全結合の射影演算、SSD、再帰的な状態更新に分け、それぞれがCGLAの演算パイプラインと転送境界にどう対応するかを調べた研究です。
    work:
      - 射影演算のGEMM、SSDのステップ1、再帰状態更新のカーネルを実装・評価。
      - カーネル演算だけでなく、DMAを含む呼出し時間とCPU参照との出力差を確認。
      - Mamba-130Mのトークン単位の実行環境への組込みで、デコード時間の内訳を計測。
      - 長い集約演算と短い集約演算の差、カーネル境界、射影演算のGEMVの課題を整理。
    results:
      - 論文では集約演算が長い射影演算と、短い集約演算・境界費用に制約されるSSDのステップ1を区別しています。
      - Mamba-130Mのデコード計測では射影演算のGEMVをボトルネックとして確認しています。
    limits:
      - トークン単位の組込みには同条件の処理全体でのCPU/GPU比較がなく、モデル全体の高速化は主張していません。
      - このページはMCSoC 2026原稿の範囲です。その後のカーネル改善や追加実験は含めません。
  dpd:
    explanation:
      - title: 非線形次数と履歴を複素数の積和へまとめる
        paragraphs:
          - 奇数次数と入力履歴を組み合わせた15項のメモリ多項式を、複素数の積和として実装しました。構成図は係数をローカルに保持し、タイル内で履歴を進める33段のパイプラインを示しています。
          - 係数を再利用する範囲と転送を含む区間を対応付け、演算単体と処理全体を別々に評価しました。比較図の時間とエネルギーは、測定区間と電力モデルの前提を確認して読む必要があります。
      - title: 数値検証とRF実機評価の区別
        paragraphs:
          - NMSE・ACLRは合成PAモデルに対する検証です。カーネル出力の検証と、実際のパワーアンプを計測器で線形化する試験は異なり、この資料は後者の実測結果を示しません。
    evidence_id: dpd
    title: メモリ多項式によるデジタルプリディストーション（DPD）の実装
    href: /research/dpd/
    body: メモリ多項式によるDPDの複素数の積和による集約演算をCGLAに割り当てる。実測時間、モデル電力による評価、合成PAモデルのNMSE・ACLRを整理。
    tags: [DPD, 複素数積和演算, 無線通信, システム評価]
    paper: Energy-Oriented CGLA Mapping of a Memory-Polynomial Digital Predistortion Kernel
    venue: APCCAS 2026 原稿
    overview: メモリ多項式によるデジタルプリディストーションの集約演算カーネルをIMAXに割り当てる研究です。係数と入力履歴を局所的に再利用し、通信向け演算を既存のプログラム可能なデータパスで実行します。
    work:
      - P=5、M=5の奇数次数のメモリ多項式構成における15項の複素数の積和による集約演算を割当て。
      - 係数をローカルメモリに保持し、1024サンプルのタイル上で履歴を進める33段のパイプラインを構成。
      - FPGA実測時間とASIC投影を分け、CUDAおよびARM-NEONとの評価境界を整理。
      - 合成PAモデルによるNMSE・ACLR検証を実施。
    results:
      - 原稿はカーネル単体と処理全体の測定時間を区別し、同じ単精度複素数の処理で比較しています。
      - NMSE・ACLRの検証は条件を統一した合成PAモデルを用いた評価です。
    limits:
      - RF計測器や実PAを使った実機の線形化試験ではありません。
      - エネルギー比較は機器全体の消費電力の仮定を使ったモデル評価で、処理内容依存の実消費電力やASIC実測ではありません。
  q-snap:
    explanation:
      - title: 量子化の境界を考慮したチャンク分割
        paragraphs:
          - 固定サイズで処理を分割すると、量子化データのアライメントと実行時のメモリ制約が転送回数に影響します。Q-snapではこれらの条件を踏まえてチャンクサイズを選択し、プリフィルの転送オーバーヘッドを評価しました。
          - 関連するIMAX3/IMAX4の発表資料ではホストと転送経路の負担を確認できます。ただし、SASIMI 2025の構成比較やSOCC 2025のQ6_Kオフロードは別の研究であり、Q-snapの改善率の根拠には使いません。
      - title: 固定チャンクと実行環境の不一致
        paragraphs:
          - レイヤごとの行サイズや量子化ブロックを考慮しない分割は、カーネル起動やDMAの回数に影響します。変更対象は既存の実行環境のチャンク決定方針です。
        figure: 2
      - title: 容量と量子化境界からサイズを決める
        paragraphs:
          - まずローカルメモリへ収まるサイズを求め、量子化ブロックに合わせて調整します。演算器自体の変更ではなく、データの分け方を実行時に選ぶ処理です。
        figure: 3
      - title: プリフィルとデコードの結果を分ける
        paragraphs:
          - 保存スライドの固定チャンクとの比較です。既存本文のプリフィル改善はこの資料の評価条件に基づき、別モデルや別の実行条件へそのまま適用する倍率ではありません。
        figure: 4
    title: CGLA向けLLM実行最適化
    evidence_id: q-snap
    venue: ICISN 2026
    paper: Q-snap Quantization-Aware Dynamic Chunking for LLM Execution on a CGLA
    overview: 量子化LLMをCGLAで実行する際のチャンク分割を扱った研究です。量子化アライメントと実行時のメモリ制約に応じてチャンクサイズを選び、プリフィルの転送オーバーヘッドを評価しました。
    tags: [Q-snap, LLM, ランタイム, チャンク分割]
    work:
      - 固定チャンク分割で生じるホスト・デバイス間転送のオーバーヘッドを分析。
      - 量子化条件とメモリ制約に応じてチャンクサイズを動的に選択する手法を実装。
      - 同じIMAX環境で従来手法とQ-snapのプリフィルのスループットを比較。
    results:
      - 既存原稿ではプリフィルのスループットを17.11 トークン/秒から27.70 トークン/秒へ改善し、1.62倍の高速化を報告しています。
      - 動作デモはLLM実行環境の紹介です。スループットの測定ログとは区別します。
    limits:
      - ここでの結果は保存原稿の評価条件に基づきます。今回の再測定ではありません。
      - モデル・量子化・prompt・ランタイムの条件を揃えずに、別の実験結果との倍率比較は行いません。
  asr:
    skip_result_figure: true
    explanation:
      - title: 音声認識の処理とカーネルの対応範囲
        paragraphs:
          - Whisper-tiny.enの実行では、FP16からFP32への変換を含む内積演算をCGLAへ割り当てました。パディングとLMM容量によって対応できる条件が変わるため、入力条件とCPU側に残る処理を含めて実装範囲を整理しました。
          - 図の処理全体と、単体の演算カーネルの測定区間は分けて扱います。関連するIMAXの構成資料は転送経路を理解するための背景資料であり、Whisperの同条件比較そのものではありません。
      - title: FP16入力を変換して内積を実行する
        paragraphs:
          - 入力の読込み、FP16からFP32への変換、積和、結果の格納という流れです。音声認識全体のうち、この内積処理をアクセラレータへ割り当てています。
        figure: 1
      - title: 転送前にパディングを取り除く
        paragraphs:
          - データの配置をそのまま転送する経路と、ホスト側で不要なパディングを除く経路を示しています。ローカルメモリへ収まる条件は、演算だけでなく転送データの準備にも依存します。
        figure: 2
      - title: LMM容量とモデル電力に基づく評価
        paragraphs:
          - 保存スライドのLMM容量を変えたPDP比較です。図の電力・時間は発表当時の条件と投影に基づくもので、今回の測定やASIC実機の測定ではありません。
        figure: 3
    title: Whisperによる音声認識のCGLA実装
    venue: CANDAR 2025
    paper: Energy-Efficient Hardware Acceleration of Whisper ASR on a CGLA
    overview: Whisperの音声認識処理をIMAXへ実装した研究です。FP16演算の配置とカーネルへの割当てを扱い、FPGAでの実行時間とASIC投影を分けて評価しています。
    tags: [Whisper, ASR, FP16, カーネルの割当て]
    work:
      - FP16からFP32への変換を含む内積演算カーネルを実装。
      - PEでの演算配置と、CPU側に残る処理の分担を整理。
      - パディングとLMM容量がカーネルの対応範囲に与える影響を評価。
      - Whisper-tiny.enの音声認識実行を評価。
    results:
      - 既存研究ではパディングの扱いとLMM容量によるカーネルの対応範囲の変化を報告しています。
      - カーネルだけでなく音声認識の処理全体の時間も扱い、FPGA実測と28nm ASIC投影を区別しています。
    limits:
      - 保存原稿のモデル・音声長・スレッド条件に基づく評価です。今回の再測定ではありません。
      - ASIC投影とモデル電力に基づくエネルギー評価は、ASIC実測や処理内容の実消費電力測定とは異なります。
  generative-ai:
    skip_result_figure: true
    explanation:
      - title: LLM用の量子化カーネルを画像生成へ適用する
        paragraphs:
          - stable-diffusion.cppの処理をGGML経由で調べ、Q8_0・Q3_Kの内積カーネルを主要演算へ適用しました。モデルが異なる用途でも、同じ量子化演算を再利用できる部分と、CPUで処理する部分を分けています。
          - 保存原稿に示した対応範囲は全演算の一部です。オフロードした演算の性能だけで画像生成全体を説明せず、FP16/FP32のCPU側処理と、FPGA実測・ASIC投影の区別を含めて評価しています。
      - title: 画像生成のどこへ量子化演算を適用するか
        paragraphs:
          - テキストエンコーダ、U-Net、VAEの処理をつなぐ中で、対応する量子化行列演算をIMAXへ渡します。画像生成の全処理をアクセラレータで実行する構成ではありません。
        figure: 1
      - title: 量子化された重みを内積へつなぐ
        paragraphs:
          - スライドはQ3_Kの重みとスケール情報を取り出し、入力との積和へ接続する流れを示しています。モデルの圧縮形式と演算時のデータ表現を分けて扱います。
        figure: 2
      - title: CPUに残る処理が全体時間を制約する
        paragraphs:
          - 保存スライドの比較はFPGA実測とASIC投影を併記しています。CPU側に残る浮動小数点処理が大きいため、オフロード部分の改善が画像生成全体の改善へ直結するとは限りません。
        figure: 3
    title: Stable DiffusionのCGLA実装
    venue: MCSoC 2025
    paper: Implementation and Evaluation of Stable Diffusion on a General-Purpose CGLA Accelerator
    overview: stable-diffusion.cppの主要演算カーネルをIMAX3へ実装した研究です。LLM向けに開発した量子化カーネルを画像生成へ適用し、CPUに残る処理とオフロードできる処理を評価しました。
    tags: [Stable Diffusion, GGML, 量子化, カーネルの対応範囲]
    work:
      - GGMLを介してQ8_0・Q3_Kの内積演算カーネルを画像生成処理へ適用。
      - U-Net等で使う演算を調べ、カーネルの対応範囲とCPU側での代替実行を分析。
      - SD-Turboの画像生成をFPGAプロトタイプで実行し、ASIC性能を投影。
    results:
      - 保存原稿では量子化演算の対応範囲をQ3_Kで10.3%、Q8_0で16.3%と報告しています。
      - FP16/FP32のCPU側での代替実行が残るため、オフロードしたカーネルの性能と画像生成全体の時間を分けて整理しています。
    limits:
      - SD-Turbo、画像サイズ、ノイズ除去のステップ等の保存原稿の条件に限った評価です。
      - 全演算をCGLAで実行する実装ではありません。ASIC投影は実シリコンの測定ではありません。
  imax:
    explanation:
      - title: ホストを変えるとボトルネックはどこへ移るか
        paragraphs:
          - SASIMI 2025のスライドとポスターは、ボード上の2コアArmホストを使うIMAX3と、16コアホストおよびPCIe Gen5を使うIMAX4を比較しています。FMAマイクロベンチマークでCPU・転送・演算の時間を分け、LLM実行で同じ構成差がどう現れるかを確認しました。
          - ポスターのLLM評価はLLaMA3 8B、Q3_K_SとQ8_0、入力Hello、生成32トークンの条件です。Q3_K_Sでは転送費用が不利に働く一方、Q8_0ではホスト側の処理能力の改善が効いています。ホストを強化すれば全条件で速くなるという結果ではありません。
      - title: Q6_Kオフロードと構成比較は別の評価
        paragraphs:
          - SOCC 2025のポスターは、Q6_Kの重みを2bitと4bitの要素から取り出し、スケール情報と組み合わせ、int8の入力との演算へ接続する流れを示しています。モデル名に含まれるQ3_K_Sと、個別にオフロードするQ6_Kカーネルは同一の識別子ではありません。
          - このカーネル実装、IMAX3/IMAX4のホスト比較、Q-snapのチャンク選択は、それぞれ変更点と評価条件が異なります。資料ごとの区間・モデル・量子化形式を揃えて結果を読み分けることを重視しました。
    title: IMAXアーキテクチャの評価と実装
    venue: SASIMI 2025 / IEEE Access
    overview: IMAXのPEとLMMを交互配置したCGLA上で、LLMのカーネルの割当てとシステム評価に取り組んだ研究です。IMAX3とIMAX4の構成を比較し、演算だけでなくホスト処理とデータ転送を分析しています。
    tags: [CGLA, プログラム可能なASIC, DMA, システム評価]
    work_figures: [0, 1]
    skip_result_figure: true
    work:
      - IMAXのPE/LMM構成と、エッジ・サーバ向け評価環境を整理。
      - 量子化LLM カーネルの実装とホスト/アクセラレータの処理分担を評価。
      - CPU処理、重み転送、演算アレイ実行等の時間内訳を分析。
    results:
      - 既存研究では、ホスト CPUと転送境界がLLM実行全体に与える影響を報告しています。
      - IMAX3/IMAX4の結果は、それぞれの評価環境と測定区間を対応付けて扱います。
    limits:
      - FPGA上の実測とASICへの投影、カーネル時間と処理全体の時間を混ぜて比較しません。
      - ハードウェア構成の紹介だけで、回路設計の担当範囲や新しい性能改善を主張するものではありません。
  facial-expression:
    explanation:
      - title: 顔検出と表情分類を一つのシステムへつなぐ
        paragraphs:
          - SASIMI 2024のポスターは、YOLOv2 tinyで顔を検出し、切り出した顔をCNNで分類する初期構成を示しています。後続のCANDARW 2024ではDenseBoxを使い、CPU前処理と同じDPUを共有する複数の処理スレッドを組み合わせました。
          - 顔検出の位置情報を次の分類処理へ渡すだけでなく、DPUがCPUの処理を待つ時間も評価しました。後続スライドの処理フローは、異なるフレームのCPU処理とDPU実行を重ねる設計を説明しています。
      - title: 構成の違いを含めて比較する
        paragraphs:
          - 顔検出と表情分類の精度・レイテンシ、FPGAリソース、全体のFPSとDPU利用率は別の評価軸です。初期ポスターのモデルと後続のマルチスレッド結果を混ぜず、どの構成・どの処理を評価した値かを対応付けています。
      - title: 2つのモデルの入出力を接続する
        paragraphs:
          - DenseBoxの出力する顔領域の座標から顔を切り出し、表情分類用の入力へ整形します。顔検出と表情分類は入出力も評価指標も異なるため、別の段階として扱います。
        figure: 2
      - title: CPUと同じDPUへ処理を割り振る
        paragraphs:
          - CPUがシステム全体を制御し、DPUが顔検出と表情分類の推論を実行します。画像取得、顔領域の受渡し、結果表示までつなぐことがシステム実装の対象です。
        figure: 3
      - title: システム全体のスループットを見る
        paragraphs:
          - この図はCANDARW 2024の単一スレッドとマルチスレッド等の比較です。モデル単体の推論時間と、画像取得から結果出力までのFPSを区別して読みます。
        figure: 4
    title: KV260のDPUによる表情認識システム
    category: edge-ai
    evidence_id: fpga-vision
    venue: CANDARW 2024 / ICIC Express Letters
    overview: Kria KV260のSoC FPGAに搭載したDPUで、顔検出と表情分類を実行するシステムです。Vitis AIでモデルを量子化・コンパイルし、CPU前処理とのマルチスレッド実行、DPUサイズ・動作周波数の選択、利用率とスループットの評価に取り組みました。
    tags: [KV260, DPU, Vitis AI, 量子化, 顔検出, マルチスレッド処理]
    work:
      - 顔検出と表情分類の2つのDNNをDPUへ実装。
      - Vitis AI 2.5のAI quantizerとAI compilerを用いて、モデルをDPUで実行できる形式へ変換。
      - カメラ入力から前処理、顔領域検出、表情分類までの処理を接続。
      - CPU前処理とDPU実行をマルチスレッド化し、利用率と処理性能を評価。
      - B512からB4096までのDPU構成と動作周波数を比較し、FPGAリソース・スループット・消費電力の関係を評価。
    results:
      - 既存のマルチスレッド研究では顔検出、表情分類、処理速度とDPU利用率を評価しています。
      - 初期のYOLOv2 tinyを使う実装と後続のDenseBoxを使う実装は、モデルとDPU構成を分けて扱います。
    limits:
      - 卒業研究・学会原稿の版ごとにモデル、スレッド数、データセット等の条件が異なります。
      - 保存原稿の紹介であり、現在のボードやモデルを用いた再測定ではありません。
    related:
      - href: /research/kv260/
        label: Vitis AIの量子化・DPU構成・協調実行の詳細
  green-onion-dnn:
    explanation:
      - title: 領域分割の出力を調製位置へ変換する
        paragraphs:
          - 発表資料の処理フローは、画像取得、ヒストグラム平坦化によるコントラスト補正、Mask R-CNNによる芯・葉のインスタンス分割、最上位分岐部のy座標出力という順序です。領域分割自体を最終出力とせず、調製機が必要とする位置へ変換しました。
          - 芯は根から先端まで続く葉、葉クラスは芯から分岐する外葉としてアノテーションします。抽出した葉の位置・枚数が変わる箇所から分岐位置を推定するため、分岐部そのものが隠れていても葉が認識できれば推定を試みられます。
      - title: 全画像と遮蔽画像を分けた評価
        paragraphs:
          - 430枚を10分割し、43枚をテスト、387枚を学習に使う評価を10回行っています。成功基準は推定y座標と正解の差が50px未満です。430枚全体の評価と、分岐部が遮蔽された39枚の評価を区別しました。
          - 遮蔽時には領域分割の推定が有効でしたが、全体の正解率ではYOLOXが上回ります。資料では全体精度の改善と物体検出との組合せを今後の課題としており、調製機の実用化が達成されたという結果ではありません。
      - title: 画像から位置座標までの処理工程
        paragraphs:
          - 前処理、インスタンス分割、葉の枚数の変化の判別を経て、最上位分岐部のy座標を出力します。検出枠を出すYOLOXとは異なる処理経路です。
        figure: 2
      - title: 芯と外葉を分けて学習する
        paragraphs:
          - 根から先端まで続く芯と、そこから分岐する外葉を別クラスとして扱います。同じ葉クラスでも個体ごとに領域を分けることが、葉の枚数を数える前提になります。
        figure: 3
      - title: 葉の枚数が変わる位置を調製位置へ変換する
        paragraphs:
          - 分割された葉の位置関係から枚数が変化する箇所を探し、最上位の分岐位置を選びます。分岐部そのものを直接認識する方法との違いを示す図です。
        figure: 4
      - title: 全画像と遮蔽画像で手法の優劣が変わる
        paragraphs:
          - 左は430枚全体、右は分岐部が遮蔽された39枚の評価です。全体ではYOLOX、遮蔽条件ではMask R-CNNが上回るため、両方の結果を合わせて適用条件を判断します。
        figure: 5
    title: DNNによる小ねぎ分岐部検出
    category: edge-ai
    evidence_id: onion-yolox
    venue: 高専研究 / ICIC継続原稿 / 2024年発表資料
    overview: 小ねぎの自動調製に向け、YOLOXによる分岐部検出とMask R-CNNによる芯・葉の領域分割を検討した研究です。検出と領域分割は別の実装として、目的と評価条件を整理しています。
    tags: [YOLOX, Mask R-CNN, 画像認識, エッジAI]
    work_figures: [0, 1]
    skip_result_figure: true
    context:
      - 調製機のノズルを合わせるため、小ねぎの分岐部位置を画像から求めることが課題です。葉が重なり、分岐部が見えなくなる条件も扱いました。
      - YOLOXは分岐部を物体として検出します。Mask R-CNNは芯・葉の領域を個別に抽出し、葉の枚数が変化する位置から分岐部を推定します。
      - 位置が見えている条件と遮蔽された条件で手法を比較し、全体の正解率と特定条件での有効性を分けて評価しました。
    work:
      - 軽量YOLOXを使って分岐部を検出し、候補の分類・選択から調製位置を推定。
      - Mask R-CNNで芯と葉を分割し、領域の位置関係から分岐部位置を推定。
      - 通常画像と遮蔽画像を分け、各手法の評価条件と適用範囲を整理。
    results:
      - YOLOX継続原稿と領域分割発表資料に、それぞれの検出・推定結果をまとめています。
      - 公開発表資料の430枚全体の評価ではYOLOXの正解率が89%、Mask R-CNNが72%でした。分岐部が遮蔽された39枚ではYOLOXが38%、Mask R-CNNが89%でした。
      - この発表の成功基準は、推定y座標と正解y座標の差が50px未満であることです。YOLOXの検出とMask R-CNNの領域分割を同じ位置推定の基準で比較しています。
      - 遮蔽時の推定に領域分割が役立つ一方、全体の正解率では検出が上回りました。この違いから、手法の選択には画像の条件を含める必要があることを整理しました。
    limits:
      - 各原稿のデータ分割、成功基準、測定区間の対応は生ログとの照合が必要です。
      - 分岐部認識の評価であり、調製機全体の成功率を示すものではありません。
    related:
      - href: /research/green-onion-edge/
        label: 古典的なエッジ検出による分岐部抽出
    references:
      - href: https://speakerdeck.com/takuto_andtt/xiao-negidiao-zhi-wei-zhi-jian-chu-notamenoinsutansusegumentesiyon
        label: 小ねぎ調製位置検出のためのインスタンスセグメンテーション（公開発表資料）
  green-onion-edge:
    explanation:
      - title: 見たい特徴を残し、ノイズを段階的に除く
        paragraphs:
          - 発表スライドでは、まず緑色領域と葉の輪郭に基づくマスクで背景や輪郭を除き、分岐部があると推定した領域へSobelフィルタを適用します。得られたエッジを8連結でラベリングし、面積・周囲長・角度で分岐部の繊維斜線とノイズを分類します。
          - 壁面の汚れ、葉の傷、分岐部以外の繊維もエッジになるため、単に輪郭を検出するだけでは位置を決められません。対象に固有の特徴とノイズの特徴を分けることで、最上部の分岐位置を求める構成です。
      - title: 古典的画像処理と領域分割の適用条件
        paragraphs:
          - この方法は分岐部の斜線が画像に現れることを前提とします。葉の重なりで斜線が隠れる条件は、別記事のMask R-CNNによる葉の位置からの推定と区別します。2023年の発表と2024年のRaspberry Pi評価も、同条件の速度・精度比較ではありません。
      - title: 分岐部を求める処理全体
        paragraphs:
          - マスクで対象領域を絞り、Sobelフィルタ、特徴量による分類、最上部エッジの出力へ進みます。下図は2023年の卒業研究発表の処理工程です。
        figure: 2
      - title: 背景と葉の輪郭をマスクで除く
        paragraphs:
          - 緑色領域と葉の輪郭に基づく2種類のマスクを組み合わせます。壁面の汚れや葉の輪郭が分岐部候補に混ざることを抑える前処理です。
        figure: 3
      - title: 面積だけでは分けにくい繊維を角度で区別する
        paragraphs:
          - 葉の繊維も分岐部と似た斜線として検出されます。面積と周囲長による除去後に角度を調べることで、残った候補を絞ります。
        figure: 4
      - title: 特徴量を組み合わせたときの変化
        paragraphs:
          - 発表資料は、分類なし、面積、周囲長、それらの組合せを比較しています。これは2023年の評価であり、2024年のRaspberry Pi評価と同じ条件の比較ではありません。
        figure: 5
      - title: 見えない斜線と輝度差の小さい斜線
        paragraphs:
          - 分岐部が外葉に隠れると、検出対象の斜線を画像から取り出せません。表面との輝度差が小さい場合も難しく、特徴量の調整だけで遮蔽を解決できるわけではありません。
        figure: 6
    title: エッジ検出による小ねぎ分岐部検出
    category: edge-ai
    evidence_id: onion-edge
    venue: 本科卒業研究 2023 / 農業情報研究 2024
    overview: 小ねぎの分岐部付近に現れる斜線を、エッジ検出で抽出する研究です。ニューラルネットワークを用いず、Raspberry Pi等のエッジ機器で調製位置を推定する画像処理に取り組みました。
    tags: [エッジ検出, ソーベル, 画像処理, Raspberry Pi]
    work_figures: [1, 0]
    skip_result_figure: true
    context:
      - 小ねぎの調製作業でノズルを合わせるため、分岐部の位置を画像から推定することが目的です。
      - 分岐部に現れる繊維の斜線に着目し、画像処理で特徴を抽出しました。エッジ機器の演算資源を考慮し、ニューラルネットワークを用いない方法を検討しました。
    work:
      - 小ねぎ調製機への入力画像から、色と輪郭を使って対象領域を抽出。
      - 分岐部の推定領域へソーベルフィルタとラベリングを適用。
      - エッジの特徴量を使って斜線を抽出し、分岐部の位置を推定。
      - Raspberry Pi上で検出率と処理時間を評価。
    results:
      - 2023年の本科卒論・研究報告には、分岐部斜線の検出率92%を記載しています。
      - 2024年の論文には、Raspberry Pi 3で検出率90.6%、処理時間455 msを記載しています。
    limits:
      - 2023年と2024年の結果は異なる資料の評価であり、同条件の比較ではありません。
      - 評価対象は分岐部斜線の検出です。実機の皮むき成功率や、YOLOXとの同条件比較ではありません。
    related:
      - href: /research/green-onion-dnn/
        label: YOLOXによる検出とMask R-CNNによる領域分割
