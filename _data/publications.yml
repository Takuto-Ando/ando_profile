        abstractJa: 近年，こねぎ生産における最低賃金の上昇等雇用環境が変化しており，人件費を抑えるために人手の不要なこねぎ調製機の開発が求められている．現行の調製機では一度に不要な葉を全て除去できず，二次処理のために多くの人手を要する．正確な調製を行うためには，外葉最上部の分岐部位置に調製用ノズル位置を合わせることが有効であることが分かっている．したがって，こねぎ分岐部の位置を検出し，ノズルの位置を自動で合わせることができれば二次処理を必要としない調製機を開発できる．そこで本稿は，分岐部を検出するためにこねぎ分岐部における特有の斜線を抽出する手法を提案する．本手法は，エッジ検出による斜線抽出とラベリング処理を行うことで頑健な検出を行う．本手法を実際のこねぎ画像に適用した結果，分岐部斜線の検出率は 92%であり，分岐部位置を検出できた．
