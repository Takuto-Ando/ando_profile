      - authors:
          - name: Takuto Ando
            me: true
          - name: Yasuhiko Nakashima
        title: Implementation and Evaluation of BitNet Inference on a CGLA by Signed-Int4 Instructions
        abstractEn: "Large language model (LLM) inference transfers model weights and activations for every generated token, making memory traffic and its energy cost part of the decode path. BitNet b1.58 represents its low-bit weights by ternary values and uses integer activations. However, this arithmetic does not match conventional int8 or floating-point general matrix multiplication, and existing BitNet accelerators implement it in specialized datapaths. We instead map this operation to a CPU-Grounded Linear Array (CGLA), a programmable ASIC with explicit direct memory access, local memories, and reusable compiler-visible integer lanes. The mapping adds OP_SMA4 as a reusable signed-int4 multiply-accumulate instruction rather than a BitNet-only datapath. Each ternary weight occupies one signed 4-bit lane. Each int8 activation is split into two signed-int4 fragments and reconstructed by shift-and-add. Frequency scaling of the 145 MHz FPGA measurement to an 840 MHz 28 nm CGLA achieved 0.390 ns per signed-int4 product. We showed that CGLA-offloaded BitNet C++ execution measures 2.52 tokens/s."
        abstractSource: "https://arxiv.org/abs/2609.27453"
        venue: 2026 Fourteenth International Symposium on Computing and Networking Workshops (CANDARW 2026)
        citation: November 2026
