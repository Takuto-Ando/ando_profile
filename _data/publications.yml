      - authors:
          - name: 安藤 拓翔
            me: true
          - name: 宗片 吉史
          - name: 中島 康彦
        title: CGLA上の多様なAIワークロードに向けた統合ソフトウェアスタックの実装と今後の展望
        abstractOrigin: "cgla_research/papers/HOTSPA_26/cgla_software_stack/paper.tex"
        abstractSource: "https://www.ieice.org/publications/search/summary.php?id=143759&tbl=ken"
        abstractJa: "AI ワークロードの多様化に伴い,推論基盤には電力効率を保ちながら異なるワークロードへ展開できる柔軟性が求められる. GPU は汎用性が高い一方で消費電力が大きく,専用 ASIC は高効率だが対象ワークロードが固定されやすい. FPGA は柔軟だが,動作周波数と実行性能に制約がある. そこで本稿では,これらの中間に位置する CGLA (CPU-Grounded Linear Array) 上で,llama.cpp,whisper.cpp,stable-diffusion.cpp などの ggml 系 OSS を対象に,共通する実装方法と初期評価を整理する. CPU 側の行列積・dot積実装を IMAX へオフロードし,この実装方法を音声認識と画像生成にも適用した. 既存結果より,大規模言語モデルのトークン生成フェーズは LOAD とホスト側処理に支配され,動的チャンク分割によりトークン解析フェーズは 1.62 倍に高速化した. Whisper 音声認識は Jetson AGX Orin 比 1.90 倍,RTX 4090 比 9.83 倍の電力効率を達成した. Stable Diffusion では FP16/FP32/整数型が混在したモデルの実装に成功した. これらを踏まえ,共通のフロントエンド,計測に基づくランタイム,方策に応じて切り替えるバックエンドから成るソフトウェアスタックの論点を示す."
        abstractEn: "As AI workloads diversify, inference platforms must provide both power efficiency and the flexibility to support a range of workloads. GPUs are highly programmable but power-hungry, whereas dedicated ASICs are efficient but typically tailored to specific workloads. FPGAs are flexible, but their operating frequency and execution performance are often limited. In this paper, we present a common implementation approach and an initial evaluation for ggml-based OSS workloads on CGLA/IMAX, including llama.cpp, whisper.cpp, and stable-diffusion.cpp. In llama.cpp, we offload CPU-side matrix multiplication and dot-product kernels to IMAX and extend the same implementation boundary to ASR and image generation workloads. Our prior results show that LLM decode is dominated by LOAD and host-side processing, Q-Snap improves prefill performance by 1.62×, Whisper ASR achieves 1.90× and 9.83× higher energy efficiency than Jetson AGX Orin and RTX 4090, respectively, and Stable Diffusion is implemented with mixed FP16/FP32/quantized execution. Based on these observations, we discuss software-stack issues for CGLA, including a common frontend, a measurement-driven runtime, and policy-specialized backends."
