        title: Lightweight YOLOX-based Green Onion Branching Point Detection for Automated Peeling on Edge Device
        abstractEn: "Agricultural automation has become critical as labor continues to decline worldwide. In green onion processing, current peeling machines require significant manual work due to imprecise leaf removal. Prior edge detection methods were tested only on uniform stems of a single variety, limiting their practical use where green onions vary in morphology. The key challenge is developing a detection system that maintains performance across varieties and growth stages without frequent adjustments. Here we show that an improved YOLOX-nano model effectively detects branching points across diverse varieties, achieving a 0.929 detection score for the second branching point and 46 ms processing time on Jetson Orin Nano. Unlike edge detection methods, our deep learning approach handles variations in onion varieties and growth stages robustly and maintains performance under varying conditions. These results show that lightweight deep learning systems can reliably automate green onion peeling while achieving real-time performance on edge devices. The proposed system advances automated green onion peeling and could extend to similar agricultural tasks."
