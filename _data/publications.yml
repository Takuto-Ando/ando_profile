          - name: Yasuhiko Nakashima
        title: "Q-snap: Quantization-aware dynamic chunking for LLM execution on a CGLA"
        abstractEn: "This paper addresses the critical energy inefficiency of LLM inference on standard GPUs by leveraging a Coarse-Grained Linear Array (CGLA). We identify that static workload chunking in existing frameworks exposes prohibitive data transfer latency overheads on CGLAs. We introduce Q-Snap (Quantization-Aware Dynamic Chunking), a scheduling strategy that maximizes execution burst sizes based on runtime memory constraints and quantization alignment. Using an FPGA prototype and synthesis-based 28 nm ASIC projections, our method achieves a 1.62× speedup over the unoptimized baseline on the same hardware in the prefill phase. Our 28 nm CGLA design demonstrates 27 % better energy efficiency compared to a 4 nm RTX 4090, demonstrating that hardware-aware scheduling enables even mature process nodes to deliver superior sustainability for edge LLM inference."
