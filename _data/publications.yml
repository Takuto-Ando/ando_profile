        title: DPU-Based Hardware Implementation for Real-time Facial Expression Recognition System
        venue: ICIC Express Letters
        citation: vol. 19, no. 4, pp. 419-426, 2025
        abstractEn: In this paper, we implemented a standalone DPU-based facial expression recognition system on SoC FPGA. The system consists of a face detection step and a facial expression recognition step. In conventional FPGA-based facial expression recognition systems, the Haar Cascade detector is run on the CPU due to FPGA (Field Programmable Gate Array) resource limitations in the face detection step. However, the Haar Cascade detector is less accurate than DNN (Deep Neutral Network)-based face detection for images of profile faces and images with changing lighting conditions. Onthe other hand, face detection using a DNN such as YOLO requires a long latency when executed on a CPU with low computing performance. Therefore, we offload face detection and facial expression recognition by DNN to DPU, a CNN accelerator on FPGA,to speed up the processing. In this work, we combined face detection with DenseBox andCNN-based facial expression recognition on the same DPU. The same DPU was used toimplement the facial expression recognition system, which enabled efficient use of FPGAresources while keeping the size of the circuitry
