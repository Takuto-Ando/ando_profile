    items:
      - authors:
          - name: Takuto Ando
            me: true
          - name: Yasuhiko Nakashima
        title: Mamba-Family State-Space Model Kernels on a Programmable CGLA
        abstractEn: "Edge and embedded inference is constrained by power and data movement. Mamba-family state-space models replace attention with sequence-linear recurrence, but their inference path combines dense projections, short-reduction SSD kernels, and recurrent-state updates. This paper maps these kernel groups onto IMAX, a programmable CPU-Grounded Linear Array (CGLA), and measures them from kernel execution to token-level integration. Projection kernels match the long-reduction IMAX pipeline, whereas SSD Step-1 is limited by short reductions and kernel-boundary overheads. Mamba-130M token-level integration identifies projection GEMV as the decode bottleneck. These results show that programmable CGLAs fit long-reduction projection kernels, while SSD and decode-time projection support require boundary reduction and persistent-weight execution."
        abstractSource: "https://arxiv.org/abs/2609.27437"
        venue: 2026 IEEE 19th International Symposium on Embedded Multicore/Many-core Systems-on-Chip
        citation: Regular Paper; December 14-17, 2026
        bibtexText: |-
