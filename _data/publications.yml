        title: Performance Evaluation of Flan-T5 in CGLA Based Accelerators
        links:
          - label: Links
            url: https://ieeexplore.ieee.org/document/11235382
        abstractEn: "Large Language Models (LLMs) impose significant computational and energy demands, posing challenges for deployment on edge devices. To address this, we explore the feasibility of executing Flan-T5 an instruction tuned encoder decoder LLM on IMAX3, an in memory accelerator based on a Coarse Grained Linear Array (CGLA). By leveraging existing custom instructions and hardware kernels originally developed for LLaMA v2 models, Flan-T5 inference was successfully achieved on IMAX3 without requiring any modification to the hardware instruction set or the high level inference workflow.To the best of our knowledge, this is the first implementation of Flan-T5 on a CGLA based accelerator. Although IMAX3 does not currently outperform CPUs or GPUs in execution speed or power efficiency, our analysis identifies critical system level bottlenecks particularly in host accelerator coordination and memory bandwidth that limit scalability. These findings highlight the architectural generality of quantized kernel designs across structurally distinct LLMs and provide a valuable foundation for future work on energy efficient LLM deployment using reconfigurable accelerators."
