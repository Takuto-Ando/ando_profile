        abstractJa: "本稿では, CGLAアクセラレータIMAX上でのAIアプリケーション, 特にLLM推論の実行を対象として,3D積層DRAMに代表される広帯域メモリを備えた将来IMAXにおける性能ボトルネックを予測するためのシミュレーションモデルを提示する．評価の結果, 現行IMAXにおいても, メモリ帯域の向上により1.4倍から1.9倍の性能向上が見込まれることを確認した．さらに, 本モデルに基づき, IMAXのスケーラビリティに応じたメモリ構成を検討するための見積り方法を示す．加えて, 将来的に広帯域メモリを導入した際に顕在化すると考えられるホスト側性能のボトルネックへの対応策を検討し,IMAXの並列化およびカスケード接続を組み合わせた二次元的な拡張によるスケーラビリティ向上の方針を提示する．"
