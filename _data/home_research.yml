- href: /research/q-snap/
  image: /assets/images/LLMchat_demo.gif
  caption_ja: LLM GUI チャット
  caption_en: LLM GUI chat
  title_ja: CGLA向けLLM実行最適化
  title_en: Q-snap for LLM Execution on CGLA
  body_ja: 静的なチャンク分割で顕在化する転送オーバーヘッドに着目し、量子化条件に応じてチャンクサイズを動的に決める Q-snap を提案した。プリフィルで 1.62 倍の高速化を確認している。
  body_en: I focused on transfer overhead caused by static chunking and proposed Q-snap, which dynamically adjusts chunk sizes with quantization constraints. It achieved a 1.62x speedup in the prefill phase.
  tags:
    - label: Best Paper - ICISN 2026
      kind: award
    - label: Young Researcher - SASIMI 2025
      kind: award
    - label: IEEE Access
      kind: neutral
