- href: /research/green-onion-dnn/
  image: /assets/images/negi_yolo.png
  caption_ja: YOLOX 検出結果
  caption_en: YOLOX detection result
  title_ja: DNNベースの小ねぎ分岐部検出
  title_en: DNN-Based Green Onion Branching Point Detection
  body_ja: 背景や照明条件が複雑な環境に対応するため、YOLOX ベースの検出とインスタンスセグメンテーションを用いた分岐部検出を検討した。自動調製機への実応用を見据えた認識系として整理している。
  body_en: To handle complex backgrounds and lighting conditions, I studied branching-point detection based on YOLOX and instance segmentation. This line of work targets practical deployment in automated green-onion peeling systems.
  tags:
    - label: ICIC Express Letters 2026
      kind: neutral
