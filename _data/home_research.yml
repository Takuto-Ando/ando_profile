- href: /research/imax/
  image: /assets/images/imax3andimax4.jpg
  caption_ja: IMAX アーキテクチャ
  caption_en: IMAX architecture
  title_ja: IMAX アーキテクチャの評価と実装
  title_en: IMAX Architecture
  body_ja: 演算ユニットとキャッシュメモリを交互配置した非ノイマン型 CGLA。エッジ向け IMAX3 とサーバ向け IMAX4 の比較評価やアプリケーション実装に取り組んでいる。
  body_en: IMAX is a non-von Neumann CGLA that alternates processing elements and local memories. My work includes comparative evaluation of edge-oriented IMAX3 and server-oriented IMAX4.
  tags:
    - label: CGRA / CGLA
      kind: neutral
