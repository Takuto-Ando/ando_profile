  caption_en: MCSoC 2025 evaluation
  title_ja: 生成 AI の CGLA 上での実装
  title_en: Generative AI on CGLA
  body_ja: Stable Diffusion を IMAX 上に実装し、LLM 以外の生成 AI ワークロードにも適用できることを評価した。エンドツーエンドの性能と電力効率を確認している。
  body_en: I implemented Stable Diffusion on IMAX and evaluated end-to-end performance and energy efficiency, showing that the platform can support generative AI workloads beyond LLMs.
