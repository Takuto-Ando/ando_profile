- href: /research/green-onion-edge/
  image: /assets/images/negi_machine.jpg
  caption_ja: 自動調製パイプライン
  caption_en: Autonomous trimming pipeline
  title_ja: エッジ検出による小ねぎ分岐部検出
  title_en: Edge-Detection-Based Green Onion Branching Point Detection
  body_ja: 小ねぎ分岐部に現れる斜線に着目し、エッジ検出ベースの軽量アルゴリズムを構成した。Raspberry Pi 3 上で検出率 90.6%、処理時間 455 ms を確認している。
  body_en: I designed a lightweight edge-detection-based method that extracts branching-line patterns in green onions. On Raspberry Pi 3, it achieved 90.6% detection rate with 455 ms processing time.
  tags:
    - label: ICIC Express Letters 2026
      kind: neutral
    - label: 農業情報研究 2024
      kind: neutral
