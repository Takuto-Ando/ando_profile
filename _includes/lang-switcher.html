<div class="lang-switcher" markdown="0">
  {% if site.active_lang == 'en' %}
    <a href="#" class="lang-switcher__inactive" id="lang-jp-link">日本語</a>
    <span class="lang-switcher__active">English</span>
  {% else %}
    <span class="lang-switcher__active">日本語</span>
    <a href="#" class="lang-switcher__inactive" id="lang-en-link">English</a>
  {% endif %}
  <script>
  (function() {
    var base = '{{ site.baseurl }}';
    var path = window.location.pathname;
    var jp = document.getElementById('lang-jp-link');
    var en = document.getElementById('lang-en-link');
    if (jp) {
      jp.href = path.replace(base + '/en/', base + '/');
    }
    if (en) {
      en.href = path.replace(base + '/', base + '/en/');
    }
  })();
  </script>
</div>
