<script>
document.addEventListener('DOMContentLoaded', function() {
  var base = '{{ site.baseurl }}';
  var enPrefix = base + '/en';
  var isEn = window.location.pathname.startsWith(enPrefix + '/') || window.location.pathname === enPrefix + '/';

  // Rewrite nav links on English pages
  if (isEn) {
    document.querySelectorAll('.greedy-nav .visible-links a, .greedy-nav .hidden-links a').forEach(function(a) {
      var href = a.getAttribute('href');
      if (href && href.startsWith(base + '/') && !href.startsWith(enPrefix + '/')) {
        a.setAttribute('href', enPrefix + href.slice(base.length));
      }
    });
  }

  // Make research cards clickable
  document.querySelectorAll('.bp-card[data-href]').forEach(function(card) {
    card.style.cursor = 'pointer';
    card.addEventListener('click', function() {
      var path = card.getAttribute('data-href');
      location.href = isEn ? (enPrefix + path) : (base + path);
    });
  });
});
</script>
